name: Build and release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run build
      - run: mkdir release
      - run: npx streamdeck pack com.local.yeelight.sdPlugin --output release --force
      - uses: actions/upload-artifact@v4
        with:
          name: streamdeck-plugin
          path: release/*.streamDeckPlugin
      - name: Attach to GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.streamDeckPlugin
