<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<title>Yeelight</title>
	<script src="https://sdpi-components.dev/releases/v4/sdpi-components.js"></script>
</head>
<body>
	<sdpi-item label="Lamp IP(s)">
		<sdpi-textfield setting="ip" placeholder="192.168.1.50, 192.168.1.51"></sdpi-textfield>
	</sdpi-item>
	<sdpi-item label="Mode">
		<sdpi-select setting="mode" default="set">
			<option value="set">Set to a temperature</option>
			<option value="warmer">Warmer by step</option>
			<option value="cooler">Cooler by step</option>
		</sdpi-select>
	</sdpi-item>
	<sdpi-item label="Kelvin (Set)">
		<sdpi-range setting="kelvin" min="1700" max="6500" step="100" default="4000" showlabels></sdpi-range>
	</sdpi-item>
	<sdpi-item label="Step (Warmer/Cooler)">
		<sdpi-range setting="step" min="1" max="50" default="10" showlabels></sdpi-range>
	</sdpi-item>
</body>
</html>
